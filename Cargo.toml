[workspace]
resolver = "3"
members = [
    "crates/agent",
    "crates/api/agent",
    "crates/api/ui",
    "crates/archive",
    "crates/boot",
    "crates/core",
    "crates/disk",
    "crates/e2e",
    "crates/model",
    "crates/pack",
    "crates/proxy",
    "crates/server",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "process"] }
imaged-model = { path = "crates/model", default-features = false }
imaged-archive = { path = "crates/archive" }
imaged-boot = { path = "crates/boot" }
imaged-disk = { path = "crates/disk" }
imaged-core = { path = "crates/core" }
imaged-api-agent = { path = "crates/api/agent" }
imaged-agent = { path = "crates/agent" }
imaged-pack = { path = "crates/pack" }
imaged-proxy = { path = "crates/proxy" }
injectable = "0.1.0"
tokio-stream = { version = "0.1", features = ["sync"] }
derive_more = { version = "2.1.1", features = ["constructor"] }
tracing = "0.1"
futures = "0.3.32"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio-util = "0.7.18"
scuttlecast = "=0.7.0"
clap = { version = "4.6.1", features = ["derive", "env"] }
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
sha2 = "0.10.9"
astral-tokio-tar = { version = "0.7.0", default-features = false }
async-compression = { version = "0.4", features = ["tokio", "zstd"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio-tungstenite = "0.29"
