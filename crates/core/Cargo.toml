[package]
name = "imaged-core"
version.workspace = true
edition.workspace = true

[lib]
name = "imaged_core"
path = "src/lib.rs"

[dependencies]
tokio-stream.workspace = true
derive_more = { workspace = true, features = ["display", "from_str", "is_variant"] }
tracing.workspace = true
tokio = { workspace = true, features = ["time", "fs", "io-util"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
imaged-model = { workspace = true, features = ["axum-error", "sqlx-error"] }
imaged-archive.workspace = true
tokio-util = { workspace = true, features = ["io", "rt"] }
injectable.workspace = true

axum = "0.8"

sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }

chrono = { version = "0.4.44", features = ["serde"] }
async-trait = "0.1.89"
bytes = "1.11.1"
tower-http = { version = "0.6.8", features = ["trace"] }
socket2 = { version = "0.6", features = ["all"] }
parking_lot = "0.12.5"

[target.'cfg(target_os = "linux")'.dependencies]
scuttlecast.workspace = true
local-ip-address = "0.6.13"

[features]
test-support = []

[dev-dependencies]
tokio = { workspace = true, features = ["time", "io-util"] }
