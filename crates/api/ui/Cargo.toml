[package]
name = "imaged-api-ui"
version.workspace = true
edition.workspace = true

[dependencies]
dioxus = { version = "0.7", features = ["fullstack"] }
serde = { workspace = true, features = ["derive"] }
injectable = { workspace = true }
imaged-shared = { workspace = true, features = ["serverfn"] }
imaged-core = { path = "../../core", optional = true }
tracing = { workspace = true, optional = true }
wakey = { version = "0.4.1", optional = true }

[features]
default = []
server = ["dioxus/server", "dep:imaged-core", "dep:tracing", "dep:wakey"]

[dev-dependencies]
imaged-core = { path = "../../core", features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }
axum = "0.8"
serde_json = { workspace = true }
tokio = { workspace = true }
