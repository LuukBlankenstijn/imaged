[package]
name = "imaged-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "imaged-server"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["fullstack", "router"] }
imaged-web = { path = "../web" }

imaged-api-ui = { path = "../api/ui", optional = true }
imaged-api-agent = { workspace = true, optional = true }
imaged-core = { path = "../core", optional = true }
imaged-boot = { workspace = true, optional = true }
imaged-model = { workspace = true, features = ["logging"], optional = true }
imaged-proxy = { workspace = true, optional = true }
axum = { version = "0.8", optional = true }
tokio = { workspace = true, features = ["signal", "time"], optional = true }
tokio-util = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
toml-file-refs = { version = "0.1", optional = true }

[features]
default = []
server = [
    "dioxus/server",
    "imaged-web/server",
    "dep:imaged-api-ui",
    "imaged-api-ui/server",
    "dep:imaged-api-agent",
    "dep:imaged-core",
    "dep:imaged-boot",
    "dep:imaged-model",
    "dep:imaged-proxy",
    "dep:axum",
    "dep:tokio",
    "dep:tokio-util",
    "dep:clap",
    "dep:tracing",
    "dep:serde",
    "dep:toml-file-refs",
]
web = ["dioxus/web", "imaged-web/web"]

[dev-dependencies]
imaged-server = { path = ".", features = ["server"] }
futures.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false }
tokio-tungstenite = "0.29"
