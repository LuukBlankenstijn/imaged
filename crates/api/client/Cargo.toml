[package]
name = "imaged-api-client"
version.workspace = true
edition.workspace = true

[dependencies]
dioxus-fullstack = "0.7"
dioxus-server = { version = "0.7", optional = true }
serde = { workspace = true, features = ["derive"] }
injectable = { workspace = true }
imaged-shared = { workspace = true, features = ["serverfn"] }
imaged-core = { path = "../../core", optional = true }
tracing = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
bytes = "1"

[features]
default = []
server = ["dioxus-fullstack/server", "dep:dioxus-server", "dep:imaged-core", "dep:tracing", "dep:futures"]

[dev-dependencies]
imaged-core = { path = "../../core", features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }
axum = "0.8"
serde_json = { workspace = true }
tokio = { workspace = true }
