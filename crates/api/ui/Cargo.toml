[package]
name = "imaged-api-ui"
version.workspace = true
edition.workspace = true

[dependencies]
dioxus = { version = "0.7", features = ["fullstack"] }
serde = { workspace = true, features = ["derive"] }
injectable = { workspace = true }
imaged-model = { workspace = true, features = ["serverfn"] }
imaged-core = { path = "../../core", optional = true }
imaged-archive = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
wakey = { version = "0.4.1", optional = true }
futures = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["io"], optional = true }
tokio = { workspace = true, features = ["time"], optional = true }

[features]
default = []
server = ["dioxus/server", "dep:imaged-core", "dep:imaged-archive", "dep:tracing", "dep:wakey", "dep:futures", "dep:tokio-util", "dep:tokio"]

[dev-dependencies]
imaged-core = { path = "../../core", features = ["test-support"] }
imaged-api-ui = { path = ".", features = ["server"] }
tower = { version = "0.5", features = ["util"] }
axum = "0.8"
serde_json = { workspace = true }
tokio = { workspace = true }
