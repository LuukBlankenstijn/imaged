name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v17
        with:
          name: luukblankenstijn
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Both passes are crane derivations, so their dependency builds come from
      # cachix instead of being recompiled on every run. nix builds them in
      # parallel. See nix/packages/imaged-tests.nix for why the agent needs a
      # pass of its own.
      - name: Tests
        run: |
          nix build --print-build-logs \
            .#checks.x86_64-linux.native-tests \
            .#checks.x86_64-linux.agent-tests
