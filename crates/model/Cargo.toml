[package]
name = "imaged-model"
version.workspace = true
edition.workspace = true

[features]
logging = ["dep:tracing-subscriber"]
serverfn = ["dep:dioxus-fullstack"]
axum-error = ["dep:axum", "dep:serde_json", "dep:tracing"]
sqlx-error = ["dep:sqlx"]

[dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
derive_more = { workspace = true, features = ["is_variant", "constructor", "from", "display", "from_str"] }
serde.workspace = true
thiserror.workspace = true
dioxus-fullstack = { version = "0.7", optional = true }
axum = { version = "0.8", optional = true }
serde_json = { workspace = true, optional = true }
sqlx = { version = "0.8.6", default-features = false, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
imaged-model = { path = ".", features = ["logging", "serverfn", "axum-error", "sqlx-error"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
