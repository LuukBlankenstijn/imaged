name: imaged

services:
  dnsmasq:
    image: jpillora/dnsmasq
    networks:
      pxenet:
        ipv4_address: 192.168.100.2
    cap_add:
      - NET_ADMIN
    volumes:
      - type: bind
        source: ./dnsmasq.conf
        target: /etc/dnsmasq.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../assets
        target: /tftp
        read_only: true
        bind:
          create_host_path: false

networks:
  pxenet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-netboot
    ipam:
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1
          ip_range: 192.168.100.16/28
