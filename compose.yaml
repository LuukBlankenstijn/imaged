services:
  dnsmasq:
    image: jpillora/dnsmasq
    networks:
      pxenet:
        ipv4_address: 192.168.100.2
    cap_add:
      - NET_ADMIN
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro
      - ./assets/ipxe.efi:/tftp/ipxe.efi:ro
      - ./assets/ipxe-arm64.efi:/tftp/ipxe-arm64.efi:ro
      - ./assets/undionly.kpxe:/tftp/undionly.kpxe:ro
      - ./assets/x86_64/vmlinuz:/tftp/x86_64/vmlinuz:ro
      - ./assets/x86_64/initramfs.cpio.xz:/tftp/x86_64/initramfs.cpio.xz:ro
      - ./assets/arm64/vmlinuz:/tftp/arm64/vmlinuz:ro
      - ./assets/arm64/initramfs.cpio.xz:/tftp/arm64/initramfs.cpio.xz:ro
    restart: unless-stopped

networks:
  pxenet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-netboot
    ipam:
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1
          ip_range: 192.168.100.16/28
